# DashSpec planet bundle for federation Code Center (ship-63).
plugin_id = "language.dashspec"
language_id = "dashspec"
file_extensions = [".dash", ".dashspec"]

[[projection]]
kind = "Tree"
plugin_id = "tree.outline"

[[projection]]
kind = "Diagram"
plugin_id = "dashspec.diagram"

[[projection]]
kind = "Form"
plugin_id = "dashspec.form"

[[projection]]
kind = "Preview"
plugin_id = "dashspec.preview"

[theme]
"@dashboard" = "DashSpec.Dashboard"
tab = "DashSpec.Tab"

[commands]
insert-tab = "Insert tab block at anchor"
